@if (disconnected) {
  <div class="banner">
    Roku disconnected
    <button (click)="reconnect()">Reconnect</button>
  </div>
}

@if (tvError) {
  <div class="banner tv-error">
    TV unreachable
  </div>
}

<div class="remote">
  <div class="top-row">
    <button class="nav-btn" (click)="press('Back')">Back</button>
    <button class="nav-btn" (click)="press('Home')">Home</button>
    @if (ecpEnabled) {
      <button class="nav-btn apps" (click)="openApps()">Apps</button>
    }
    <button class="nav-btn" (click)="pressPower()">Power</button>
  </div>

  <div class="dpad">
    <button class="dpad-btn up" (click)="press('Up')">&#9650;</button>
    <button class="dpad-btn left" (click)="press('Left')">&#9664;</button>
    <button class="dpad-btn ok" (click)="press('Select')">OK</button>
    <button class="dpad-btn right" (click)="press('Right')">&#9654;</button>
    <button class="dpad-btn down" (click)="press('Down')">&#9660;</button>
  </div>

  <div class="playback-row">
    <button class="ctrl-btn" (click)="press('Rev')">&#9194;</button>
    <button class="ctrl-btn play" (click)="press('Play')">&#9199;</button>
    <button class="ctrl-btn" (click)="press('Fwd')">&#9193;</button>
  </div>

  <div class="playback-row">
    <button class="ctrl-btn" (click)="press('InstantReplay')">&#8634;</button>
    <button class="ctrl-btn" (click)="press('Info')">&#9432;</button>
  </div>

  <div class="volume-row">
    <button
      class="vol-btn"
      (pointerdown)="startVolumeRepeat('down')"
      (pointerup)="stopVolumeRepeat()"
      (pointerleave)="stopVolumeRepeat()"
    >Vol &minus;</button>
    <button class="vol-btn mute" (click)="pressMute()">Mute</button>
    <button
      class="vol-btn"
      (pointerdown)="startVolumeRepeat('up')"
      (pointerup)="stopVolumeRepeat()"
      (pointerleave)="stopVolumeRepeat()"
    >Vol +</button>
  </div>

  @if (tvConfigured) {
    <div class="hdmi-row">
      <button class="hdmi-btn" (click)="pressHdmi(1)">HDMI 1</button>
      <button class="hdmi-btn" (click)="pressHdmi(2)">HDMI 2</button>
      <button class="hdmi-btn" (click)="pressHdmi(3)">HDMI 3</button>
      <button class="hdmi-btn" (click)="pressHdmi(4)">HDMI 4</button>
    </div>
  }

  <div class="text-row">
    <input
      type="text"
      [(ngModel)]="textInput"
      placeholder="Type text..."
      (keydown.enter)="sendText()"
    />
    <button (click)="sendText()" [disabled]="!textInput.trim()">Send</button>
  </div>

  <div class="bottom-row">
    <button class="listen-btn" (click)="openAudio()">Private Listening</button>
    <button class="setup-btn" (click)="openSetup()">Setup</button>
    <button class="disconnect-btn" (click)="disconnect()">Disconnect</button>
  </div>
</div>
