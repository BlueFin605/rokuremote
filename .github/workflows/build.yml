name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npx ng build --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/dist/roku-remote/browser
          retention-days: 7

  build-esp32:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Build Angular app for ESP32
        run: npx ng build --configuration esp32
        working-directory: app

      - name: Prepare web files for embedding
        run: ./esp32/scripts/prepare_web.sh

      - name: Build ESP32 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: esp32

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: roku-proxy-esp32
          path: |
            esp32/build/roku-proxy-esp32.bin
            esp32/build/bootloader/bootloader.bin
            esp32/build/partition_table/partition-table.bin
