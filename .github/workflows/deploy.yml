name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Build Angular app
        run: npx ng build --configuration production
        working-directory: app

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload to S3
        run: aws s3 sync app/dist/roku-remote/browser/ s3://rokuremote-pages-production --delete

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[0].DomainName=='rokuremote-pages-production.s3.ap-southeast-2.amazonaws.com'].Id" --output text)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

  build-esp32:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build ESP32 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32
          path: esp32

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: roku-proxy-esp32
          path: |
            esp32/build/roku-proxy-esp32.bin
            esp32/build/bootloader/bootloader.bin
            esp32/build/partition_table/partition-table.bin
